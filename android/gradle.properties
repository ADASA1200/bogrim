org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP מסרב כברירת מחדל לבנות מתוך נתיב עם תווים לא-ASCII (עברית, למשל) -
# הסיכון האמיתי (כלים ילידיים/NDK שלא מטפלים בנתיב כזה נכון) לא רלוונטי
# כאן: הפרויקט הזה כולו Kotlin, בלי קוד C/C++ משלנו - הספרייה הילידית
# היחידה (stream-webrtc-android) מגיעה כ-.so מוכן בתוך ה-AAR.
android.overridePathCheck=true
