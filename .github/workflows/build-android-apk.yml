name: build-android-apk

# בונה APK לאנדרואיד. הרצה ידנית: Actions -> build-android-apk -> Run workflow.
# כתובת שרת האיתות ברירת המחדל באפליקציה: משתנה RDESK_SERVER (למשל wss://signal.example.com).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (תאימות פרוטוקול מול Python)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          if [ -n "${{ vars.RDESK_SERVER }}" ]; then EXTRA="-PrdeskServer=${{ vars.RDESK_SERVER }}"; fi
          ./gradlew --no-daemon assembleDebug $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: RDesk-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
